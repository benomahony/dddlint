[project]
name = "dddlint"
version = "0.1.0"
description = "Polyglot ubiquitous language linter for codebases and coding agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "benomahony" }]
dependencies = [
    "pydantic>=2.13.4",
    "pygls>=2.1.1",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=1.8.1",
    "typer>=0.26.2",
]

[project.scripts]
dddlint = "dddlint.cli:app"
dddlint-lsp = "dddlint.server:main"

[project.urls]
Repository = "https://github.com/benomahony/dddlint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dddlint"]

[dependency-groups]
dev = ["pytest>=8.0"]
