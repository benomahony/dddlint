[project]
site_name = "dddlint"
site_url = "https://benomahony.github.io/dddlint"
site_description = "Polyglot ubiquitous language linter for codebases and coding agents"
site_author = "benomahony"
copyright = "&copy; 2026 benomahony"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
repo_url = "https://github.com/benomahony/dddlint"
repo_name = "benomahony/dddlint"

nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    { "Your first lint" = "tutorials/getting-started.md" },
  ] },
  { "How-to guides" = [
    { "Run in CI" = "how-to/ci.md" },
    { "Run as a pre-commit hook" = "how-to/pre-commit.md" },
    { "Get editor diagnostics (LSP)" = "how-to/editor-lsp.md" },
    { "Scope rules to domains & contexts" = "how-to/domains-contexts.md" },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "Configuration" = "reference/config.md" },
    { "Rules" = "reference/rules.md" },
    { "Python API" = "reference/python-api.md" },
  ] },
  { "Explanation" = [
    { "Ubiquitous language" = "explanation/ubiquitous-language.md" },
    { "How checking works" = "explanation/how-checking-works.md" },
  ] },
]

[project.theme]
variant = "modern"
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/benomahony/dddlint"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
